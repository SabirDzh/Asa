name: asa
description: "ASA — modern task manager with folders and filtering."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  provider: ^6.1.5+1
  iconsax: ^0.0.8
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^17.1.2
  home_widget: ^0.9.3
  http: ^1.2.0
  crypto: ^3.0.6
  url_launcher: ^6.2.0
  share_plus: ^10.1.4
  file_picker: ^10.1.2
  bonsoir: ^5.1.10
  device_calendar: ^4.3.0
  device_info_plus: ^11.1.2
  timezone: ^0.9.4
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
